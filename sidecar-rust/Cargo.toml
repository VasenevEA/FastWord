[package]
name = "fastword-sidecar"
version = "0.2.0"
edition = "2021"
description = "Native whisper.cpp sidecar for FastWord"
license = "MIT"

[[bin]]
name = "fastword-sidecar"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
anyhow = "1.0"
num_cpus = "1.16"

# Whisper backend: Metal on Apple Silicon, plain CPU elsewhere. The GigaAM
# engine (sherpa-onnx) is macOS-only for now; other platforms compile a stub
# that reports the engine as unavailable.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
# Official sherpa-onnx Rust bindings — used for the GigaAM-v3 Russian engine.
# Statically linked by default; if the prebuilt lib download fails on the
# build machine the env var SHERPA_ONNX_LIB_DIR can override it.
sherpa-onnx = "1.13"

# CPU inference elsewhere. OpenMP matters: without it (and the weight-repack
# path in current ggml) quantized models run an order of magnitude slower —
# measured 160s vs 11s for 5.4s of audio on an 18-core Xeon.
[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", features = ["openmp"] }

[profile.release]
# The cmake/cc crates derive whisper.cpp's C/C++ optimization level from
# this setting. "z" maps to a real -Oz on clang/macOS, but on MSVC it emits
# NO /O flag at all — whisper.cpp then runs ~15x slower (measured 143s vs
# 11s for 5.4s of audio). Level 3 gives /O2 on MSVC and -O3 elsewhere; the
# Rust half of the binary grows a little, whisper.cpp dominates anyway.
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
